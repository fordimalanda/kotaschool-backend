services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kotaschool
      POSTGRES_PASSWORD: kotaschool
      POSTGRES_DB: kotaschool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotaschool -d kotaschool"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://kotaschool:kotaschool@postgres:5432/kotaschool?schema=public
      JWT_SECRET: ${JWT_SECRET:-kotaschool_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
